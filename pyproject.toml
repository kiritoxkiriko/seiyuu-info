[project]
name = "nsy-station-api"
version = "0.1.0"
description = "Cloudflare Python Worker FastAPI backend for nsy 情报站"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "httpx>=0.27.0",
  "pydantic>=2.8.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3.0",
  "uvicorn>=0.30.0",
  "workers-py>=0.0.13",
  "workers-runtime-sdk>=0.0.17",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
