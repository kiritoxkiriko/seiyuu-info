name: seiyuu-info

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:4321}
      DATA_CACHE_ENABLED: ${DATA_CACHE_ENABLED:-true}
      DATABASE_URL: ${DATABASE_URL:-sqlite:///data/nsy.sqlite3}
      EVENT_FETCH_PAST_DAYS: ${EVENT_FETCH_PAST_DAYS:-183}
      EVENT_FETCH_FUTURE_DAYS: ${EVENT_FETCH_FUTURE_DAYS:-183}
      SNS_FETCH_PAST_DAYS: ${SNS_FETCH_PAST_DAYS:-183}
      EVENT_DISPLAY_PAST_DAYS: ${EVENT_DISPLAY_PAST_DAYS:-183}
      EVENT_DISPLAY_FUTURE_DAYS: ${EVENT_DISPLAY_FUTURE_DAYS:-183}
      SNS_DISPLAY_PAST_DAYS: ${SNS_DISPLAY_PAST_DAYS:-183}
      SCHEDULER_ENABLED: ${SCHEDULER_ENABLED:-true}
      SNS_SYNC_INTERVAL_MINUTES: ${SNS_SYNC_INTERVAL_MINUTES:-10}
      EVENT_SYNC_INTERVAL_MINUTES: ${EVENT_SYNC_INTERVAL_MINUTES:-60}
      MEDIA_ROOT: ${MEDIA_ROOT:-data/media}
      MEDIA_PUBLIC_PREFIX: ${MEDIA_PUBLIC_PREFIX:-/media}
      TRANSLATION_PROVIDER: ${TRANSLATION_PROVIDER:-none}
      DEEPL_API_KEY: ${DEEPL_API_KEY:-}
      DEEPL_API_URL: ${DEEPL_API_URL:-https://api-free.deepl.com/v2/translate}
      X_BEARER_TOKEN: ${X_BEARER_TOKEN:-}
    volumes:
      - ./data:/app/data
    ports:
      - "${API_PORT:-8787}:8787"
    healthcheck:
      test:
        - CMD
        - curl
        - -fsS
        - http://127.0.0.1:8787/health
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    depends_on:
      api:
        condition: service_healthy
    environment:
      HOST: 0.0.0.0
      PORT: 4321
      INTERNAL_API_BASE_URL: http://api:8787
    ports:
      - "${WEB_PORT:-4321}:4321"
    healthcheck:
      test:
        - CMD
        - curl
        - -fsS
        - http://127.0.0.1:4321
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
